<!DOCTYPE html>
<html>
<head>
<title>Barak Bani Epaper</title>
<link rel="stylesheet" href="style.css">
<link id="faviconLink" rel="icon" type="image/x-icon" href="">
</head>
<body>

<header class="header">
  <img id="siteLogo" src="logo.png" alt="Barak Bani Logo" class="logo">
</header>


<nav style="display: flex; justify-content: center; align-items: center; position: relative;">
<div style="display: flex; gap: 30px; align-items: center;">
<a href="/">Home</a>
<a href="archive.html">Archive</a>
</div>
<div style="position: absolute; right: 10px; display: flex; align-items: center; gap: 8px;">
    <input type="date" id="datePicker" onchange="loadDate(this.value)" style="padding: 5px; border: 1px solid #ddd; border-radius: 3px;">
    <button onclick="loadToday()" style="padding: 5px 10px; background: #b30000; color: white; border: none; border-radius: 3px; cursor: pointer;">Today</button>
</div>
</nav>

<div id="viewer"></div>

<button id="topBtn" onclick="scrollToPage(0)">Top</button>

<footer>© 2026 Barak Bani Dainik</footer>

<script>
// Load branding (logo and favicon)
fetch('/branding')
.then(res => res.json())
.then(data => {
    const logoImg = document.getElementById('siteLogo');
    const faviconLink = document.getElementById('faviconLink');
    
    if (data.logo) {
        logoImg.src = '/uploads/' + data.logo;
    }
    
    if (data.favicon) {
        faviconLink.href = '/uploads/' + data.favicon;
    }
})
.catch(err => {
    console.error('Error loading branding:', err);
});
</script>
<script src="script.js"></script>
</body>
</html>
